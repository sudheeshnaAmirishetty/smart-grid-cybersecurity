{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center fade-in">
  <div class="col-md-6">
    <div class="card p-4">
      <h2 class="mb-4">Create an Account</h2>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success btn-glow">Register</button>
      </form>
      <p class="mt-3">Already have an account? <a href="{% url 'login' %}">Log in</a>.</p>
    </div>
  </div>
</div>
{% endblock %}
